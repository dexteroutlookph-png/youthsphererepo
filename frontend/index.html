<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouthSphere | ISIED</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- App Desktop Header -->
  <header class="app-header">
    <div class="brand-container">
      <img src="../logo.png" class="brand-logo-img" alt="YouthSphere logo">
      <div>
        <div class="brand-title">YouthSphere</div>
        <div class="brand-subtitle">ISIED Feed</div>
      </div>
    </div>

    <nav class="desktop-nav">
      <a href="index.html" class="nav-link active">Home</a>
      <a href="announcements.html" class="nav-link">Announcements</a>
      <a href="rewards.html" class="nav-link">Reward Card</a>
      <a href="profile.html" class="nav-link">Profile</a>
      <a href="notifications.html" class="nav-link">Notifications</a>
    </nav>
  </header>

  <main class="feed-layout">
    
    <!-- Post Composer Card -->
    <div class="post-composer-card">
      <div class="composer-trigger-box" id="openComposerTrigger" role="button" tabindex="0" aria-haspopup="dialog" aria-controls="composerModal">
        <img id="userComposerAvatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 24 24' fill='%23062D58'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>" class="post-avatar" alt="Your Avatar" style="width: 36px; height: 36px;">
        <span class="composer-placeholder" id="composerPlaceholderText">Share something with ISIED Youth...</span>
      </div>
    </div>

    <!-- Feed Container -->
    <div id="feedAlert" class="alert-box" style="display: none; padding: 12px; margin-bottom: 16px; border-radius: 6px; font-size: 13px;"></div>
    
    <div id="feedContainer">
      <div style="text-align: center; padding: 40px; color: var(--text-muted);">
        Loading district feed posts...
      </div>
    </div>

  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-nav">
    <ul class="mobile-nav-list">
      <li><a href="index.html" class="mobile-nav-link active">Home</a></li>
      <li><a href="announcements.html" class="mobile-nav-link">Announcements</a></li>
      <li><a href="rewards.html" class="mobile-nav-link">Card</a></li>
      <li><a href="profile.html" class="mobile-nav-link">Profile</a></li>
    </ul>
  </nav>

  <!-- Create Post Modal Dialog -->
  <div id="composerModal" class="modal-overlay">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="composerModalTitle">
      <div class="modal-header">
        <h3 class="modal-title" id="composerModalTitle">Create Post</h3>
        <button type="button" id="closeComposerBtn" aria-label="Close create post dialog" style="background:none; border:none; font-size:20px; cursor:pointer;">&times;</button>
      </div>
      <form id="postForm">
        <div class="modal-body">
          <div class="form-group">
            <textarea id="postContentInput" class="form-control" rows="4" placeholder="What's happening in your local church or cluster?" required style="resize: vertical;"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Attach Image (Optional)</label>
            <input type="file" id="postImageInput" accept="image/*,video/mp4,video/webm,video/quicktime" class="form-control">
          </div>

          <div id="postImagePreviewContainer" style="display: none; margin-top: 10px; text-align: center;">
            <img id="postImagePreview" src="" alt="Post Attachment Preview" style="max-width: 100%; max-height: 200px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
            <video id="postVideoPreview" controls style="display:none; max-width:100%; max-height:200px; border-radius:var(--radius-md);" aria-label="Post video preview"></video>
            <button type="button" id="removeImageBtn" class="btn btn-outline" style="font-size: 11px; margin-top: 6px; padding: 4px 8px;">Remove Photo</button>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelPostBtn" class="btn btn-outline">Cancel</button>
          <button type="submit" id="submitPostBtn" class="btn btn-primary">Publish Post</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
