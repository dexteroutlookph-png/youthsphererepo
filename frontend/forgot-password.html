<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - YouthSphere | ISIED</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="app-header"><div class="brand-container"><img src="../logo.png" class="brand-logo-img" alt="YouthSphere logo"><div><div class="brand-title">YouthSphere</div><div class="brand-subtitle">Password Recovery</div></div></div></header>
  <main class="auth-page-container"><section class="auth-card" style="max-width: 480px; margin: 0 auto;">
    <h1 class="auth-card-title">Reset your password</h1>
    <p class="auth-card-subtitle">Enter your account email to request a password reset link.</p>
    <div id="resetAlert" class="alert-box" role="status" aria-live="polite" style="display:none; padding:10px; margin-bottom:15px; border-radius:6px; font-size:13px;"></div>
    <form id="forgotPasswordForm" novalidate>
      <div class="form-group"><label for="resetEmail" class="form-label">Email address</label><input type="email" id="resetEmail" class="form-control" autocomplete="email" required></div>
      <button type="submit" id="resetRequestBtn" class="btn btn-primary" style="width:100%;">Request reset link</button>
    </form>
    <p style="margin-top:20px; text-align:center; font-size:13px;"><a href="login.html">Return to sign in</a></p>
  </section></main>
  <script src="js/api.js"></script><script src="js/forgot-password.js"></script>
</body>
</html>
