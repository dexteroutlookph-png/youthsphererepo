<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>District Announcements - YouthSphere | ISIED</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/announcements.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-container">
      <img src="../logo.png" class="brand-logo-img" alt="YouthSphere logo">
      <div>
        <div class="brand-title">YouthSphere</div>
        <div class="brand-subtitle">Connect. Share. Grow.</div>
      </div>
    </div>

    <nav class="desktop-nav">
      <a href="index.html" class="nav-link" data-icon="⌂">Home</a>
      <a href="announcements.html" class="nav-link active" data-icon="◈">Announcements</a>
      <a href="rewards.html" class="nav-link" data-icon="▣">Reward Card</a>
      <a href="profile.html" class="nav-link" data-icon="♙">Profile</a>
      <a href="notifications.html" class="nav-link" data-icon="◉">Notifications</a>
    </nav>
  </header>

  <main class="feed-layout announcements-page">
    <header class="announcements-heading">
      <div>
        <p class="dashboard-eyebrow">YOUTHSPHERE / ISIED</p>
        <h1>District Announcements</h1>
        <p>Official updates and event schedules from the ISIED Executive Committee.</p>
      </div>
      <label class="announcement-search-wrap" for="announcementSearch">
        <span aria-hidden="true">⌕</span>
        <input type="text" id="announcementSearch" class="form-control" placeholder="Search announcements...">
      </label>
    </header>

    <div class="announcement-toolbar">
      <div id="categoryFilters" class="announcement-filters" role="group" aria-label="Filter announcements">
        <button class="btn btn-outline filter-pill active" data-category="ALL">All Updates</button>
        <button class="btn btn-outline filter-pill" data-category="EVENTS">Events</button>
        <button class="btn btn-outline filter-pill" data-category="MINISTRY">Ministry</button>
        <button class="btn btn-outline filter-pill" data-category="URGENT">Urgent</button>
      </div>
    </div>
    <div id="announcementsContainer" class="announcements-list">
      <div class="dashboard-loading">
        Loading district announcements...
      </div>
    </div>

  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-nav">
    <ul class="mobile-nav-list">
      <li><a href="index.html" class="mobile-nav-link">Home</a></li>
      <li><a href="announcements.html" class="mobile-nav-link active">Announcements</a></li>
      <li><a href="rewards.html" class="mobile-nav-link">Card</a></li>
      <li><a href="profile.html" class="mobile-nav-link">Profile</a></li>
      <li><a href="notifications.html" class="mobile-nav-link">Alerts</a></li>
    </ul>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/announcements.js"></script>
</body>
</html>
