<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>District Announcements - YouthSphere | ISIED</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-container">
      <img src="../logo.png" class="brand-logo-img" alt="YouthSphere logo">
      <div>
        <div class="brand-title">YouthSphere</div>
        <div class="brand-subtitle">ISIED Announcements</div>
      </div>
    </div>

    <nav class="desktop-nav">
      <a href="/" class="nav-link">Home</a>
      <a href="/announcements" class="nav-link active">Announcements</a>
      <a href="/rewards" class="nav-link">Reward Card</a>
      <a href="/profile" class="nav-link">Profile</a>
      <a href="/notifications" class="nav-link">Notifications</a>
      <button id="logoutBtn" class="btn btn-outline" style="color: #fff; border-color: rgba(255,255,255,0.3); padding: 6px 12px; font-size: 13px;">Logout</button>
    </nav>
  </header>

  <main class="feed-layout">
    
    <div style="margin-bottom: 20px;">
      <h2 style="color: var(--primary-navy); margin-bottom: 4px;">District Announcements</h2>
      <p style="color: var(--text-secondary); font-size: 14px;">Official updates and event schedules from the ISIED Executive Committee.</p>
    </div>

    <!-- Category Filter Pills & Search Bar -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; justify-content: space-between;">
      <div id="categoryFilters" style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="btn btn-outline filter-pill active" data-category="ALL" style="font-size: 12px; padding: 6px 14px; border-radius: 20px;">All Updates</button>
        <button class="btn btn-outline filter-pill" data-category="EVENTS" style="font-size: 12px; padding: 6px 14px; border-radius: 20px;">Events</button>
        <button class="btn btn-outline filter-pill" data-category="MINISTRY" style="font-size: 12px; padding: 6px 14px; border-radius: 20px;">Ministry</button>
        <button class="btn btn-outline filter-pill" data-category="URGENT" style="font-size: 12px; padding: 6px 14px; border-radius: 20px;">Urgent</button>
      </div>

      <input 
        type="text" 
        id="announcementSearch" 
        class="form-control" 
        placeholder="Search announcements..." 
        style="max-width: 260px; padding: 8px 12px; font-size: 13px;"
      >
    </div>

    <!-- Announcements Feed Container -->
    <div id="announcementsContainer">
      <div style="text-align: center; padding: 40px; color: var(--text-muted);">
        Loading district announcements...
      </div>
    </div>

  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-nav">
    <ul class="mobile-nav-list">
      <li><a href="/" class="mobile-nav-link">Home</a></li>
      <li><a href="/announcements" class="mobile-nav-link active">Announcements</a></li>
      <li><a href="/rewards" class="mobile-nav-link">Card</a></li>
      <li><a href="/profile" class="mobile-nav-link">Profile</a></li>
      <li><button type="button" id="mobileLogoutBtn" class="mobile-nav-link mobile-nav-button">Logout</button></li>
    </ul>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/announcements.js"></script>
</body>
</html>
