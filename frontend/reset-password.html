<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - YouthSphere | ISIED</title>
  <link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/auth.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="app-header"><div class="brand-container"><img src="../logo.png" class="brand-logo-img" alt="YouthSphere logo"><div><div class="brand-title">YouthSphere</div><div class="brand-subtitle">Password Recovery</div></div></div></header>
  <main class="auth-page-container"><section class="auth-card" style="max-width: 480px; margin: 0 auto;">
    <h1 class="auth-card-title">Set a new password</h1>
    <div id="resetAlert" class="alert-box" role="status" aria-live="polite" style="display:none; padding:10px; margin-bottom:15px; border-radius:6px; font-size:13px;"></div>
    <form id="resetPasswordForm" novalidate>
      <div class="form-group"><label for="newPassword" class="form-label">New password</label><input type="password" id="newPassword" class="form-control" autocomplete="new-password" minlength="6" required></div>
      <div class="form-group"><label for="confirmPassword" class="form-label">Confirm password</label><input type="password" id="confirmPassword" class="form-control" autocomplete="new-password" minlength="6" required></div>
      <button type="submit" id="resetPasswordBtn" class="btn btn-primary" style="width:100%;">Set new password</button>
    </form>
  </section></main>
  <script src="js/api.js"></script><script src="js/reset-password.js"></script>
</body>
</html>
